<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select Days</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:0 auto;padding:24px;line-height:1.4}
  h1{font-size:1.5rem}
  label{display:block;padding:12px 0;font-size:1.1rem}
  input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin-right:10px}
  textarea{width:100%;box-sizing:border-box;min-height:120px;padding:12px;font:inherit;border:1px solid #aaa;border-radius:8px}
  button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;font-size:1.05rem;cursor:pointer}
  .note{font-size:.9rem;opacity:.75}
</style>
</head>
<body>
<h1>Select the days</h1>
<form id="form">
  <label><input type="checkbox" name="day" value="Monday"> Monday</label>
  <label><input type="checkbox" name="day" value="Tuesday"> Tuesday</label>
  <label><input type="checkbox" name="day" value="Wednesday"> Wednesday</label>
  <label><input type="checkbox" name="day" value="Thursday"> Thursday</label>
  <label><input type="checkbox" name="day" value="Friday"> Friday</label>
  <label><input type="checkbox" name="day" value="Saturday"> Saturday</label>

  <h2>Additional text</h2>
  <textarea id="additional" placeholder="Add any additional information..."></textarea>

  <button type="submit">Submit</button>
</form>
<p class="note">Submit opens your phone's messaging app with the selected information addressed to both recipients. You will need to tap Send.</p>

<script>
document.getElementById("form").addEventListener("submit", function(e) {
  e.preventDefault();

  const days = [...document.querySelectorAll('input[name="day"]:checked')]
    .map(x => x.value);

  const additional = document.getElementById("additional").value.trim();

  if (!days.length && !additional) {
    alert("Please select at least one day or enter additional text.");
    return;
  }

  let body = "Selected days: " + (days.length ? days.join(", ") : "None");
  if (additional) body += "\\n\\nAdditional text: " + additional;

  const recipients = "9089378951,7329211425";
  window.location.href = "sms:" + recipients + "?&body=" + encodeURIComponent(body);
});
</script>
</body>
</html>
